<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Miam Up - Aperçu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><text y=%221.2em%22 font-size=%2296%22>🍽️</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    
<div class="md:h-screen p-4">
    <div class="flex flex-col justify-center items-center bg-white h-full">
        <div class="grid md:grid-cols-2 items-center gap-y-8 max-w-7xl w-full [box-shadow:0_2px_13px_-6px_rgba(0,0,0,0.4)] rounded-xl relative overflow-hidden">
            
            <!-- Image côté gauche -->
            <div class="max-md:order-1 p-4 bg-gray-50 h-full">
                <img src="https://readymadeui.com/signin-image.webp" class="max-w-[90%] w-full h-full object-contain block mx-auto" alt="inscription-image" />
            </div>

            <!-- Formulaire côté droit -->
            <div class="flex items-center p-6 max-w-md w-full h-full mx-auto">
                <form class="w-full">
                    
                    <div class="lg:mb-12 mb-8">
                        <h1 class="text-blue-500 text-3xl font-bold max-md:text-center">Créer un compte</h1>
                        <p class="text-gray-500 text-sm mt-2 max-md:text-center">Rejoignez Miam Up dès maintenant</p>
                    </div>

                    <!-- Champ Nom -->
                    <div class="mb-4">
                        <label class="text-slate-900 text-sm font-semibold block mb-2">Nom</label>
                        <div class="relative flex items-center">
                            <input name="nom" type="text" required 
                                class="w-full bg-transparent text-sm text-slate-900 border-2 border-gray-200 focus:border-blue-500 pl-4 pr-12 py-3.5 outline-0 rounded-xl" 
                                placeholder="Votre nom" />
                            <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-[18px] h-[18px] absolute right-4" viewBox="0 0 24 24">
                                <circle cx="10" cy="7" r="6"></circle>
                                <path d="M14 15H6a5 5 0 0 0-5 5 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 5 5 0 0 0-5-5zm8-4h-2.59l.3-.29a1 1 0 0 0-1.42-1.42l-2 2a1 1 0 0 0 0 1.42l2 2a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.42l-.3-.29H22a1 1 0 0 0 0-2z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Champ Prénom -->
                    <div class="mb-4">
                        <label class="text-slate-900 text-sm font-semibold block mb-2">Prénom</label>
                        <div class="relative flex items-center">
                            <input name="prenom" type="text" required 
                                class="w-full bg-transparent text-sm text-slate-900 border-2 border-gray-200 focus:border-blue-500 pl-4 pr-12 py-3.5 outline-0 rounded-xl" 
                                placeholder="Votre prénom" />
                            <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-[18px] h-[18px] absolute right-4" viewBox="0 0 24 24">
                                <circle cx="10" cy="7" r="6"></circle>
                                <path d="M14 15H6a5 5 0 0 0-5 5 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 5 5 0 0 0-5-5z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Champ Email -->
                    <div class="mb-4">
                        <label class="text-slate-900 text-sm font-semibold block mb-2">Email</label>
                        <div class="relative flex items-center">
                            <input name="email" type="email" required 
                                class="w-full bg-transparent text-sm text-slate-900 border-2 border-gray-200 focus:border-blue-500 pl-4 pr-12 py-3.5 outline-0 rounded-xl" 
                                placeholder="votre@email.com" />
                            <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-[18px] h-[18px] absolute right-4" viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Champ Pseudo -->
                    <div class="mb-4">
                        <label class="text-slate-900 text-sm font-semibold block mb-2">Pseudo</label>
                        <div class="relative flex items-center">
                            <input name="pseudo" type="text" required 
                                class="w-full bg-transparent text-sm text-slate-900 border-2 border-gray-200 focus:border-blue-500 pl-4 pr-12 py-3.5 outline-0 rounded-xl" 
                                placeholder="Votre pseudo" />
                            <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-[18px] h-[18px] absolute right-4" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Champ Téléphone -->
                    <div class="mb-6">
                        <label class="text-slate-900 text-sm font-semibold block mb-2">Téléphone</label>
                        <div class="relative flex items-center">
                            <input name="telephone" type="tel" required 
                                class="w-full bg-transparent text-sm text-slate-900 border-2 border-gray-200 focus:border-blue-500 pl-4 pr-12 py-3.5 outline-0 rounded-xl" 
                                placeholder="06 12 34 56 78" />
                            <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-[18px] h-[18px] absolute right-4" viewBox="0 0 24 24">
                                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Bouton Submit -->
                    <div class="mt-6">
                        <button type="submit" 
                            class="w-full shadow-xl py-3 px-4 text-base font-medium tracking-wide rounded-xl bg-blue-500 hover:bg-blue-600 text-white cursor-pointer focus:outline-0 transition-all">
                            S'inscrire
                        </button>

                        <!-- Lien vers connexion -->
                        <p class="text-sm text-gray-500 text-center mt-6">
                            Déjà membre ? 
                            <a href="#" class="text-blue-500 font-semibold hover:underline ml-1">Connectez-vous</a>
                        </p>
                    </div>
                </form>
            </div>

            <!-- Cercle décoratif -->
            <div class="absolute -top-6 -right-6 w-20 h-20 rounded-full bg-blue-400 max-sm:hidden"></div>
        </div>
    </div>
</div>

</body>
</html>
